name: Collect public-source updates

on:
  schedule:
    # 16:15 UTC daily (11:15 EST / 12:15 EDT).
    - cron: "15 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-source-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit and registry validation tests
        run: python -m unittest discover -s tests -v
      - name: Validate source registry
        run: python scripts/validate_source_registry.py
      - name: Collect official public feeds
        run: python scripts/collect_sources.py
      - name: Commit daily collection
        run: |
          if git diff --quiet -- data/collection; then
            echo "No collection changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/collection
          git commit -m "Record daily public-source collection"
          git push
